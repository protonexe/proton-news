<!DOCTYPE html>
<html lang="en" data-theme="mono">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>PROTON-NEWS // FINANCE</title>
<link rel="stylesheet" href="dash.css"/>
<style>
.qhead{display:flex;gap:1rem;align-items:baseline;flex-wrap:wrap;margin-bottom:.4rem}
.qhead .sym{font-size:.8rem;letter-spacing:2px;color:var(--dim)}
.qhead .nm{font-size:.9rem;color:var(--hi)}
.qhead .last{font-size:2rem;font-weight:bold}
.qhead .chg{font-size:.9rem}
.chart{border:1px solid var(--line);background:var(--panel);padding:.4rem;margin:.7rem 0}
.chart svg{display:block;width:100%;height:300px}
.axis{font-size:.6rem;fill:var(--dim)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.5rem}
.stat{border:1px solid var(--line);padding:.4rem .55rem;background:var(--panel)}
.stat .k{font-size:.58rem;letter-spacing:1.4px;color:var(--dim)}
.stat .v{font-size:.92rem;margin-top:.1rem;font-variant-numeric:tabular-nums}
.crypto img{width:16px;height:16px;vertical-align:-3px;margin-right:.35rem;filter:grayscale(.2)}
.pctpos{color:var(--hi)}.pctneg{color:var(--red)}
@media(max-width:700px){.chart svg{height:220px}}
</style>
</head>
<body>
<header id="top"></header>
<main class="wrap">
  <div class="hero spread">
    <div><h1>&gt; FINANCE // TERMINAL</h1><p>QUOTES · RANGE CHART · CRYPTO BOARD</p></div>
    <div class="small muted">source: yahoo finance + coingecko · 5m cache</div>
  </div>

  <div class="panel">
    <div class="row" style="margin-bottom:.6rem">
      <input id="sym" type="text" placeholder="symbol e.g. NVDA" style="max-width:200px" autocomplete="off"/>
      <button id="go">[ LOAD ]</button>
      <div class="chips" id="quick"></div>
    </div>
    <div class="row" id="ranges">
      <span class="small muted">RANGE</span>
      <button data-r="1d" class="act">1D</button>
      <button data-r="5d">5D</button>
      <button data-r="1mo">1MO</button>
      <button data-r="6mo">6MO</button>
      <button data-r="1y">1Y</button>
    </div>
    <div class="qhead" style="margin-top:.8rem">
      <span class="sym" id="q-sym">AAPL</span>
      <span class="nm" id="q-name">Apple Inc.</span>
      <span class="last num" id="q-last">--</span>
      <span class="chg num" id="q-chg">--</span>
      <span class="small muted" id="q-ex">--</span>
    </div>
    <div class="chart"><svg id="chart" viewBox="0 0 900 300" preserveAspectRatio="none"></svg></div>
    <div class="statgrid" id="stats"></div>
  </div>

  <div class="panel" style="margin-top:.7rem">
    <div class="spread"><h2>CRYPTO BOARD · TOP 12</h2><span class="small muted" id="crypto-src">coingecko</span></div>
    <div class="scrollx">
      <table class="tbl crypto" id="crypto">
        <tr><th>#</th><th>ASSET</th><th>PRICE</th><th>1H</th><th>24H</th><th>7D</th><th>MKT CAP</th><th>VOLUME</th></tr>
        <tr><td colspan="8" class="muted">loading…</td></tr>
      </table>
    </div>
  </div>
</main>
<div class="foot">PROTON-NEWS TERMINAL v2 · <a href="index.html">← DASHBOARD</a></div>

<script src="dash.js"></script>
<script>
PN.mountHeader("finance.html");

const QUICK=["AAPL","NVDA","MSFT","TSLA","AMZN","GOOGL","META","SPY"];
document.getElementById("quick").innerHTML=QUICK.map(s=>`<button data-s="${s}">${s}</button>`).join("");
document.querySelectorAll("#quick button").forEach(b=>b.onclick=()=>{document.getElementById("sym").value=b.dataset.s;load(b.dataset.s);});
document.getElementById("go").onclick=()=>load(document.getElementById("sym").value.trim().toUpperCase());

let range="1d";
document.querySelectorAll("#ranges button").forEach(b=>b.onclick=()=>{
  range=b.dataset.r;
  document.querySelectorAll("#ranges button").forEach(x=>x.classList.toggle("act",x===b));
  load(document.getElementById("q-sym").textContent);
});

function money(v,d){return v==null?"—":Number(v).toLocaleString(undefined,{maximumFractionDigits:d==null?2:d});}

function drawChart(hist,colorPos){
  const svg=document.getElementById("chart");
  const closes=(hist||[]).map(h=>Number(h.close)).filter(v=>isFinite(v));
  if(closes.length<2){svg.innerHTML='<text x="20" y="40" class="axis">no chart data</text>';return;}
  const W=900,H=300,P=34;
  const min=Math.min(...closes),max=Math.max(...closes);
  const span=max-min||1;
  const x=i=>P+i*(W-P*2)/(closes.length-1);
  const y=v=>H-P-((v-min)/span)*(H-P*1.6);
  const pts=closes.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const area=`${P},${H-P} ${pts} ${W-P},${H-P}`;
  const grid=[0,.25,.5,.75,1].map(f=>{
    const gy=(H-P-(f*(H-P*1.6))).toFixed(1);
    const gv=(min+f*span).toFixed(2);
    return `<line x1="${P}" y1="${gy}" x2="${W-P}" y2="${gy}" stroke="currentColor" stroke-opacity=".14" stroke-dasharray="3 5"/>
            <text x="4" y="${gy}" class="axis" fill="currentColor">${gv}</text>`;
  }).join("");
  const first=hist[0]&&hist[0].date||"", last=hist[hist.length-1]&&hist[hist.length-1].date||"";
  svg.innerHTML=`
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="currentColor" stop-opacity=".28"/>
      <stop offset="100%" stop-color="currentColor" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid}
    <polygon points="${area}" fill="url(#g)"/>
    <polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="${x(closes.length-1)}" cy="${y(closes[closes.length-1])}" r="3.5" fill="currentColor"/>
    <text x="${P}" y="${H-8}" class="axis" fill="currentColor">${first}</text>
    <text x="${W-P}" y="${H-8}" class="axis" fill="currentColor" text-anchor="end">${last}</text>`;
}

async function load(sym){
  sym=(sym||"AAPL").toUpperCase();
  document.getElementById("sym").value=sym;
  document.getElementById("q-sym").textContent=sym;
  document.getElementById("stats").innerHTML='<div class="stat"><div class="k">STATUS</div><div class="v">loading…</div></div>';
  try{
    const d=await PN.fetchJSON(`/stocks/${encodeURIComponent(sym)}?range=${encodeURIComponent(range)}`,15000);
    document.getElementById("q-name").textContent=d.name||sym;
    document.getElementById("q-last").textContent=money(d.last);
    const c=Number(d.changePct);
    document.getElementById("q-chg").textContent=(c>=0?"▲ +":"▼ ")+(isFinite(c)?c.toFixed(2):"—")+"%";
    document.getElementById("q-chg").className="chg num "+(c>=0?"pctpos":"pctneg");
    document.getElementById("q-ex").textContent=(d.exchange||"")+" · "+(d.currency||"");
    drawChart(d.history||[],c>=0);
    const s=[
      ["OPEN",d.dayOpen],["HIGH",d.dayHigh],["LOW",d.dayLow],["PREV CLOSE",d.previousClose],
      ["VOLUME",d.volume],["52W HIGH",d.fiftyTwoHigh],["52W LOW",d.fiftyTwoLow],["CHANGE",d.change]
    ];
    document.getElementById("stats").innerHTML=s.map(([k,v])=>
      `<div class="stat"><div class="k">${k}</div><div class="v">${money(v, k==="VOLUME"?0:2)}</div></div>`).join("");
  }catch(e){
    document.getElementById("q-name").textContent=sym+" (demo fallback)";
    document.getElementById("q-last").textContent="--";
    document.getElementById("q-chg").textContent="source unavailable";
    document.getElementById("q-chg").className="chg num muted";
    document.getElementById("stats").innerHTML='<div class="stat"><div class="k">STATUS</div><div class="v muted">quote uplink failed — retry</div></div>';
    drawChart(PN.MOCK.map((_,i)=>({close:100+Math.sin(i)*4+i*0.4,date:String(i)})),true);
  }
}

document.getElementById("sym").addEventListener("keydown",e=>{if(e.key==="Enter")load(e.target.value.trim().toUpperCase());});

(async()=>{
  try{
    const d=await PN.fetchJSON("/crypto/markets?limit=12",15000);
    document.getElementById("crypto").innerHTML=
      '<tr><th>#</th><th>ASSET</th><th>PRICE</th><th>1H</th><th>24H</th><th>7D</th><th>MKT CAP</th><th>VOLUME</th></tr>'+
      d.map(c=>{
        const cls=(v)=>Number(v)>=0?"pctpos":"pctneg";
        const pct=(v)=>isFinite(Number(v))?(Number(v)>=0?"+":"")+Number(v).toFixed(2)+"%":"—";
        return `<tr><td class="muted">${c.rank}</td>
          <td>${c.image?`<img src="${c.image}" alt="" loading="lazy"/>`:""} <b>${PN.esc(c.symbol)}</b> <span class="muted">${PN.esc(c.name)}</span></td>
          <td>$${money(c.price,c.price<1?6:2)}</td>
          <td class="${cls(c.chg1h)}">${pct(c.chg1h)}</td>
          <td class="${cls(c.chg24h)}">${pct(c.chg24h)}</td>
          <td class="${cls(c.chg7d)}">${pct(c.chg7d)}</td>
          <td>$${money(c.mcap,0)}</td>
          <td>$${money(c.volume,0)}</td></tr>`;
      }).join("");
  }catch(e){
    document.getElementById("crypto").innerHTML=
      '<tr><th>#</th><th>ASSET</th><th>PRICE</th><th>1H</th><th>24H</th><th>7D</th><th>MKT CAP</th><th>VOLUME</th></tr>'+
      '<tr><td colspan="8" class="muted">crypto uplink failed (rate limited?) — retry shortly</td></tr>';
  }
})();

load("AAPL");
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>DEMO D // STORY READER PANE</title>
<link rel="stylesheet" href="demo.css"/>
<style>
header{padding:.55rem .8rem;border-bottom:2px solid var(--fg);display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;position:sticky;top:0;background:#000;z-index:10}
header .brand{font-size:1rem;letter-spacing:1px}
header .brand b{color:var(--hi)}
header .keys{margin-left:auto;font-size:.64rem;color:var(--dim);letter-spacing:1px}
.shell{padding:.7rem}
.article h1{font-size:1.25rem;line-height:1.3;margin:.2rem 0 .5rem}
.article .am{display:flex;gap:.5rem;flex-wrap:wrap;font-size:.66rem;color:var(--dim);letter-spacing:.5px;padding-bottom:.6rem;border-bottom:1px dashed var(--line);margin-bottom:.7rem}
.article p{font-size:.86rem;line-height:1.6;color:#00b800;margin:0 0 .8rem}
.article .lead{color:var(--hi);font-size:.94rem}
.article blockquote{margin:0 0 .8rem;padding:.5rem .8rem;border-left:2px solid var(--fg);background:rgba(0,40,0,.3);font-size:.82rem;color:#00a800}
.controls{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.8rem;border-top:1px dashed var(--line);padding-top:.7rem}
.empty{color:var(--dim);font-size:.8rem;text-align:center;margin-top:22vh}
@media(max-width:820px){.shell{padding:.5rem}}
</style>
</head>
<body>
<header>
  <div class="brand"><b>&gt; PROTON</b>-NEWS <span class="muted small" style="letter-spacing:2px">// DEMO D · READER</span></div>
  <div class="keys">J / K navigate · ESC back to list</div>
</header>
<div class="shell">
  <div class="split" id="split">
    <div class="listpane" id="listpane"><p class="muted pad">syncing wire...</p></div>
    <div class="readerpane" id="readerpane"><div class="empty">← pick a headline to read it here<br/><span class="small">no tabs, no page jumps</span></div></div>
  </div>
</div>

<script src="demo.js"></script>
<script>
let stories=[], sel=-1;
const split=document.getElementById("split");
const listpane=document.getElementById("listpane");
const reader=document.getElementById("readerpane");

function renderList(){
  listpane.innerHTML=stories.map((s,i)=>`
    <div class="line-item ${i===sel?'sel':''}" data-i="${i}">
      <div class="t">${s.title}</div>
      <div class="m"><span>${s.source||""}</span><span>${ago(s.ts)}</span><span>${s.sector||""}</span></div>
    </div>`).join("");
  listpane.querySelectorAll(".line-item").forEach(n=>{
    n.onclick=()=>openStory(Number(n.dataset.i));
  });
}

function openStory(i){
  if(i<0||i>=stories.length)return;
  sel=i;
  renderList();
  const s=stories[i];
  const body=(s.summary&&s.summary!=="[No summary available]")
    ? `<p class="lead">${s.summary}</p><p>${s.summary}</p><p>Full item text would stream from the source feed here. In production this pane renders the extracted article body, keeps the CRT styling, and never sends you to a new tab unless you ask for it.</p>`
    : `<p class="lead">${s.title}</p><p>No summary was supplied by this feed. The pane falls back to the headline plus feed metadata, with a direct source link below.</p>`;
  reader.innerHTML=`
    <div class="article">
      <div class="am"><span class="tag">${s.sector||"GENERAL"}</span><span>${s.country||""}</span><span>${s.source||""} · ${ago(s.ts)}</span></div>
      <h1>${s.title}</h1>
      ${body}
      <blockquote>Reader pane concept: keep the headline list on the left, article on the right. Nothing unmounts when you switch stories, so scanning is fast.</blockquote>
      <div class="controls">
        <button id="prev">[ ← PREV ]</button>
        <button id="next">[ NEXT → ]</button>
        <button id="src">[ OPEN SOURCE ↗ ]</button>
        <button id="tts">[ READ ALOUD ]</button>
        <button id="close" class="muted">[ CLOSE ]</button>
      </div>
    </div>`;
  reader.querySelector("#prev").onclick=()=>openStory(i-1);
  reader.querySelector("#next").onclick=()=>openStory(i+1);
  reader.querySelector("#src").onclick=()=>{ if(s.link) window.open(s.link,"_blank","noopener"); else toast("demo: this mock story has no source url"); };
  reader.querySelector("#tts").onclick=()=>{
    try{
      const u=new SpeechSynthesisUtterance(s.title+" . "+(s.summary||""));
      u.rate=1; speechSynthesis.cancel(); speechSynthesis.speak(u); toast("reading aloud...");
    }catch(e){ toast("speech unavailable"); }
  };
  reader.querySelector("#close").onclick=()=>{sel=-1;renderList();split.classList.remove("reading")};
  reader.scrollTop=0;
  if(window.innerWidth<=820) split.classList.add("reading");
}

let toastTimer;
function toast(msg){
  let t=document.getElementById("toast");
  if(!t){t=document.createElement("div");t.id="toast";document.body.appendChild(t);}
  t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),1800);
}

document.addEventListener("keydown",e=>{
  if(e.key==="j"||e.key==="ArrowDown"){e.preventDefault();openStory(Math.min(stories.length-1,sel+1));}
  if(e.key==="k"||e.key==="ArrowUp"){e.preventDefault();openStory(Math.max(0,sel-1));}
  if(e.key==="Escape"){sel=-1;renderList();split.classList.remove("reading");}
});

loadStories(24).then(d=>{
  stories=d;renderList();
  if(stories.length)openStory(0);
});
</script>
</body>
</html>

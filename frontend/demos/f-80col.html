<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>DEMO F // 80-COLUMN MODE</title>
<link rel="stylesheet" href="demo.css"/>
<style>
body{display:flex;justify-content:center;padding:1rem .6rem 3rem}
.page{width:80ch;max-width:100%}
.page.fluid{width:100%;max-width:1400px}
.top{display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap;font-size:.72rem;border-bottom:1px solid var(--fg);padding-bottom:.35rem;margin-bottom:.5rem;color:var(--dim)}
.top b{color:var(--fg)}
nav.tnav{display:flex;gap:.9rem;flex-wrap:wrap;font-size:.78rem;margin:.4rem 0 .6rem;border-bottom:1px dashed var(--line);padding-bottom:.5rem}
nav.tnav button{border:none;padding:.1rem .2rem;font-size:.78rem;letter-spacing:0}
nav.tnav button.act{background:var(--fg);color:#000;padding:.1rem .35rem}
.rule{color:var(--dim);font-size:.6rem;overflow:hidden;white-space:nowrap;margin:.35rem 0}
.item{margin:0 0 .55rem}
.item .l1{font-size:.82rem;line-height:1.35}
.item .l2{font-size:.63rem;color:var(--dim);letter-spacing:.5px}
.item a{color:var(--fg)}
.prompt{font-size:.78rem;color:var(--dim);margin:.6rem 0 .3rem}
.cursor{display:inline-block;width:.55em;height:1em;background:var(--fg);vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
table.big{width:100%;border-collapse:collapse;font-size:.72rem}
table.big th,table.big td{border-bottom:1px dashed var(--line);padding:.22rem .3rem;text-align:left;white-space:nowrap}
.widebox{overflow-x:auto;border:1px solid var(--line)}
.modebar{display:flex;gap:.4rem;margin-bottom:.6rem}
</style>
</head>
<body>
<div class="page" id="page">
  <div class="top">
    <span><b>&gt; PROTON-NEWS</b> v2.0</span>
    <span id="clocks">NYC --:-- · LDN --:-- · TYO --:--</span>
    <span>242 stories · 36 countries · <b>● online</b></span>
  </div>

  <div class="modebar">
    <button data-w="80" class="act">[ 80 COL ]</button>
    <button data-w="fluid">[ FULL WIDTH ]</button>
    <span class="muted small" style="align-self:center">80ch is the real terminal width</span>
  </div>

  <nav class="tnav" id="nav">
    <button class="act" data-s="news">[1] NEWS</button>
    <button data-s="finance">[2] FINANCE</button>
    <button data-s="weather">[3] WEATHER</button>
    <button data-s="sports">[4] SPORTS</button>
    <button data-s="world">[5] WORLD</button>
    <button data-s="planes">[6] PLANES</button>
  </nav>

  <div id="body"></div>

  <div class="prompt">$ <span class="cursor"></span> commands: news · finance · sports · world · planes</div>
</div>

<script src="demo.js"></script>
<script>
let mode="80", sec="news", stories=[];
const page=document.getElementById("page");
const body=document.getElementById("body");

document.querySelectorAll(".modebar button").forEach(b=>b.onclick=()=>{
  mode=b.dataset.w;
  page.classList.toggle("fluid",mode==="fluid");
  document.querySelectorAll(".modebar button").forEach(x=>x.classList.toggle("act",x===b));
  render();
});
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{
  sec=b.dataset.s;
  document.querySelectorAll("#nav button").forEach(x=>x.classList.toggle("act",x===b));
  render();
});

function rule(){return '<div class="rule">'+ "-".repeat(mode==="fluid"?160:78) +"</div>"}

function render(){
  if(sec==="news"){
    body.innerHTML=stories.slice(0,12).map((s,i)=>
      `<div class="item">
        <div class="l1">${String(i+1).padStart(2,"0")} ${s.title}</div>
        <div class="l2">${(s.source||"")} · ${ago(s.ts)} · ${(s.country||"").toUpperCase()} · ${s.sector||"GEN"}</div>
      </div>`).join("")+
      `<div class="prompt">$ more --page=2  <span class="muted">[ 12 of ${stories.length} shown ]</span></div>`;
  } else if(sec==="finance"){
    body.innerHTML=rule()+
      `<div class="widebox"><table class="big"><tr><th>SYM</th><th>LAST</th><th>CHG%</th><th>VOL</th><th>RANGE</th><th>MA20</th><th>SIGNAL</th></tr>
      ${mockMarkets.map(m=>`<tr><td>${m.s}</td><td>${m.p}</td><td class="${m.c>=0?'pos':'neg'}">${m.c>=0?'+':''}${m.c.toFixed(2)}</td><td>--</td><td>--</td><td>--</td><td class="${m.c>=0?'pos':'neg'}">${m.c>=0?'▲':'▼'}</td></tr>`).join("")}
      </table></div>`+rule()+
      `<div class="item"><div class="l1">Tables scroll horizontally in 80-col mode.</div><div class="l2">full width mode shows all columns at once.</div></div>`;
  } else if(sec==="sports"){
    body.innerHTML=mockMatches.map(m=>
      `<div class="item"><div class="l1">${m.league.padEnd(4)} ${m.a} ${m.sa} — ${m.sb} ${m.b}</div>
      <div class="l2">${m.live?'LIVE · '+m.q:'FINAL'}</div></div>`).join("")+rule();
  } else if(sec==="weather"){
    body.innerHTML=`<div class="item"><div class="l1">NEW YORK      14C  clear</div><div class="l2">feels 12C · wind NW 14 · humidity 48% · AQI 32</div></div>
      ${rule()}
      <div class="item"><div class="l1">TOKYO         18C  clear</div><div class="l2">feels 18C · wind SE 8 · humidity 61% · AQI 41</div></div>
      ${rule()}
      <div class="item"><div class="l1">LONDON        11C  drizzle</div><div class="l2">feels 9C · wind W 22 · humidity 78% · AQI 28</div></div>`;
  } else {
    body.innerHTML=`<div class="item"><div class="l1">${sec.toUpperCase()} — 80-col layout placeholder</div><div class="l2">the point of this demo is the hard 80-character measure.</div></div>`+rule();
  }
}

const tz=(z)=>new Intl.DateTimeFormat("en-GB",{timeZone:z,hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date());
setInterval(()=>{
  document.getElementById("clocks").textContent=
    "NYC "+tz("America/New_York")+" · LDN "+tz("Europe/London")+" · TYO "+tz("Asia/Tokyo");
},1000);

loadStories(18).then(d=>{stories=d;render();});
</script>
</body>
</html>

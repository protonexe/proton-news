<!DOCTYPE html>
<html lang="en" data-theme="mono">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>PROTON-NEWS // NEWS READER</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Ctext x='2' y='12' font-family='monospace' font-size='12' fill='%2300cc00'%3E%3E_%3C/text%3E%3C/svg%3E"/>
<link rel="stylesheet" href="dash.css"/>
<style>
#q{flex:1;min-width:140px;max-width:340px}
#read-progress{font-size:.64rem;color:var(--dim);letter-spacing:1px}
.article .tags{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:.6rem}
.article .note{font-size:.66rem;color:var(--dim);border-top:1px dashed var(--line);padding-top:.5rem;margin-top:.8rem;line-height:1.5}
.xbody{margin-top:.2rem}
.xload{font-size:.7rem;color:var(--dim);letter-spacing:1.2px;border-left:2px solid var(--line);
  padding:.4rem .6rem;background:var(--panel);animation:xpulse 1.4s ease-in-out infinite}
@keyframes xpulse{0%,100%{opacity:.45}50%{opacity:1}}
.article p.xfail{font-size:.76rem;line-height:1.55;color:var(--dim);border-left:2px solid var(--amber);
  padding:.45rem .65rem;background:var(--panel);opacity:1}
.xbody p:last-child{margin-bottom:.4rem}
.xfig{margin:0 0 .85rem;border:1px solid var(--line);background:var(--panel);overflow:hidden}
.xfig img{display:block;width:100%;max-height:320px;object-fit:cover;filter:saturate(.9)}
.xfig figcaption{font-size:.56rem;color:var(--dim);letter-spacing:1px;padding:.3rem .4rem;border-top:1px dashed var(--line)}
.line-item .bodytag{position:absolute;right:.4rem;bottom:.35rem;font-size:.5rem;letter-spacing:1px;
  color:var(--bg);background:var(--dim);padding:.05rem .25rem}
.line-item .star{color:var(--hi);margin-right:.3rem}
#readerpane{font-size:14px}

/* reader control bar: three tidy segmented groups instead of a button pile */
.controls{display:flex;flex-wrap:wrap;gap:.55rem;align-items:stretch;justify-content:space-between;
  border-top:1px dashed var(--line);padding:.7rem 0 .25rem;margin-top:.8rem}
.ctlgroup{display:flex;align-items:stretch;border:1px solid var(--line);background:var(--panel)}
.ctlgroup button{border:0;border-right:1px solid var(--line);background:transparent;
  padding:.38rem .7rem;font-size:.64rem;letter-spacing:1px;white-space:nowrap}
.ctlgroup button:last-child{border-right:0}
.ctlgroup button:hover{background:var(--sel)}
.ctlgroup button:active{background:var(--fg);color:var(--bg)}
.ctlgroup button.primary{color:var(--hi)}
.ctlgroup .pos{display:flex;align-items:center;padding:0 .6rem;color:var(--dim);
  font-size:.62rem;letter-spacing:1px;border-right:1px solid var(--line);
  font-variant-numeric:tabular-nums;min-width:64px;justify-content:center}
.ctlgroup .ctllabel{display:flex;align-items:center;padding:0 .5rem;color:var(--dim);
  font-size:.55rem;letter-spacing:1.6px;border-right:1px solid var(--line)}
@media(max-width:860px){
  #q{max-width:none}
  .controls{justify-content:flex-start}
  .ctlgroup{flex:1 1 auto;justify-content:center}
}
</style>
</head>
<body>
<header id="top"></header>

<div class="toolbar">
  <span class="small muted">$ news --reader</span>
  <input id="q" type="text" placeholder="filter headlines, source, country, body text..." autocomplete="off"/>
  <div class="chips" id="sectors"></div>
  <label class="small muted row" style="gap:.3rem"><input type="checkbox" id="unread-only"/> UNREAD ONLY</label>
  <label class="small muted row" style="gap:.3rem"><input type="checkbox" id="saved-only"/> SAVED</label>
  <button id="mark-all" class="muted">[ MARK ALL READ ]</button>
  <span id="read-progress"></span>
</div>

<div class="split" id="split">
  <div class="listpane" id="listpane"><div class="empty">syncing wire...</div></div>
  <div class="readerpane" id="readerpane">
    <div class="empty">← pick a headline<br/><span class="small">J / K walks the wire · ESC returns to list</span></div>
  </div>
</div>

<script src="dash.js"></script>
<script src="dash-store.js"></script>
<script>
PN.mountHeader("news.html");

const KEY_READ="pn_dash_read", KEY_FS="pn_dash_fs", KEY_SAVED="pn_dash_saved";
let readSet=new Set();
try{readSet=new Set(JSON.parse(localStorage.getItem(KEY_READ)||"[]"));}catch(e){}
let savedSet=new Set();
try{savedSet=new Set(JSON.parse(localStorage.getItem(KEY_SAVED)||"[]"));}catch(e){}
let fs=Number(localStorage.getItem(KEY_FS)||14);
let stories=[], view=[], sel=-1, query="", sector="ALL", region="", unreadOnly=false, savedOnly=false;
let speaking=false, fullText="", artSeq=0;
let bodyHits=new Set(), searchSeq=0, searchTimer=null;
const ART_CACHE=new Map();

const params=new URLSearchParams(location.search);
if(params.get("country")){query=params.get("country");document.getElementById("q").value=query;}
if(params.get("q")){query=params.get("q");document.getElementById("q").value=query;}
if(params.get("sector")){sector=params.get("sector").toUpperCase();}
if(params.get("region")){region=params.get("region").toUpperCase();}
if(params.get("saved")==="1"){savedOnly=true;document.getElementById("saved-only").checked=true;}

const listpane=document.getElementById("listpane");
const reader=document.getElementById("readerpane");
const split=document.getElementById("split");

function keyOf(s){return s.link||s.title;}
function isRead(s){return readSet.has(keyOf(s));}
function isSaved(s){return savedSet.has(keyOf(s));}
function saveRead(){localStorage.setItem(KEY_READ,JSON.stringify([...readSet].slice(-400)));}
function saveSaved(){localStorage.setItem(KEY_SAVED,JSON.stringify([...savedSet].slice(-500)));}
function applyFs(){reader.style.fontSize=fs+"px";localStorage.setItem(KEY_FS,String(fs));}
function hashFor(s){return "#a="+encodeURIComponent(keyOf(s));}

function sectors(){
  const set=["ALL",...new Set(stories.map(s=>(s.sector||"GENERAL").toUpperCase()))];
  const el=document.getElementById("sectors");
  el.innerHTML=set.map(s=>`<button data-s="${PN.esc(s)}" class="${s===sector?"act":""}">${s}</button>`).join("");
  el.querySelectorAll("button").forEach(b=>b.onclick=()=>{sector=b.dataset.s;recalc();sectors();});
}

function recalc(){
  const q=query.trim().toLowerCase();
  const deep=q.length>=3;
  view=stories.filter(s=>{
    if(sector!=="ALL"&&(s.sector||"GENERAL").toUpperCase()!==sector)return false;
    if(region&&(s.category||"UNKNOWN").toUpperCase()!==region)return false;
    if(unreadOnly&&isRead(s))return false;
    if(savedOnly&&!isSaved(s))return false;
    if(!q)return true;
    const head=((s.title||"")+" "+(s.summary||"")+" "+(s.source||"")+" "+(s.country||"")+" "+(s.category||"")).toLowerCase();
    if(head.includes(q))return true;
    return deep&&bodyHits.has(keyOf(s));
  });
  const unread=stories.filter(s=>!isRead(s)).length;
  const savedCount=stories.filter(isSaved).length;
  document.getElementById("read-progress").textContent=
    `${view.length}/${stories.length} shown · ${unread} unread`+
    (region?` · ${region}`:"")+
    (savedOnly?` · ${savedCount} saved`:"")+
    (deep&&bodyHits.size?` · ${bodyHits.size} body hits`:"");
  renderList();
}

function renderList(){
  if(!view.length){
    listpane.innerHTML='<div class="empty">no matches.<br/><span class="small">clear the filter or sector</span></div>';
    return;
  }
  const q=query.trim(), deep=q.length>=3;
  listpane.innerHTML=view.map((s,i)=>{
    const r=isRead(s);
    const cur=sel>=0&&view[sel]&&keyOf(view[sel])===keyOf(s);
    const hit=deep&&bodyHits.has(keyOf(s));
    return `<div class="line-item ${r?"read":""} ${cur?"sel":""}" data-i="${i}">
      <div class="t">${isSaved(s)?'<span class="star" title="saved">★</span>':""}${PN.esc(s.title)}</div>
      <div class="m"><span>${PN.esc(s.source||"")}</span><span>${PN.ago(s.ts)}</span><span>${PN.esc(s.country||"")}</span></div>
      ${hit?'<span class="bodytag">BODY</span>':""}
      ${r?"":'<span class="newdot"></span>'}
    </div>`;
  }).join("");
  listpane.querySelectorAll(".line-item").forEach(n=>n.onclick=()=>open(Number(n.dataset.i)));
}

function scheduleBodySearch(){
  clearTimeout(searchTimer);
  const q=query.trim();
  if(q.length<3){searchSeq++;bodyHits=new Set();return;}
  searchTimer=setTimeout(runBodySearch,320);
}

function runBodySearch(){
  const q=query.trim();
  if(q.length<3){bodyHits=new Set();return;}
  const seq=++searchSeq;
  Promise.all([
    PNStore.search(q,60).catch(()=>[]),
    PN.fetchJSON("/article/search?q="+encodeURIComponent(q)+"&limit=60",25000)
      .then(d=>(d&&d.results)||[]).catch(()=>[])
  ]).then(([local,server])=>{
    if(seq!==searchSeq)return;
    bodyHits=new Set([
      ...local.map(x=>x.link),
      ...server.map(x=>x.url)
    ]);
    recalc();
  });
}

function open(i,opts){
  opts=opts||{};
  if(i<0||i>=view.length)return;
  sel=i;
  const s=view[i];
  readSet.add(keyOf(s));saveRead();renderList();
  const gen=++artSeq;
  fullText="";
  const link=s.link||"";
  try{
    if(!opts.fromHistory){
      if(opts.replace)history.replaceState({link:link},"",hashFor(s));
      else history.pushState({link:link},"",hashFor(s));
    }
  }catch(e){}
  const sum=s.summary&&s.summary!=="[No summary available]"?s.summary:"";
  const intro=sum
    ? `<p class="lead">${PN.esc(sum)}</p>`
    : `<p class="lead">${PN.esc(s.title)}</p>`;
  reader.innerHTML=`
    <article class="article">
      <div class="crumb">NEWS / ${PN.esc((s.category||"WORLD").toUpperCase())} / ${PN.esc((s.sector||"GENERAL"))}</div>
      <div class="tags">
        <span class="tag">${PN.esc(s.sector||"GEN")}</span>
        <span class="tag">${PN.esc(s.country||"")}</span>
        <span class="tag" id="x-tag" style="display:none"></span>
      </div>
      <h1>${PN.esc(s.title)}</h1>
      <div class="am">
        <span>${PN.esc(s.source||"wire")}</span>
        <span>·</span><span>${PN.ago(s.ts)}</span>
        ${s.published?`<span>·</span><span title="${PN.esc(s.published)}">filed ${PN.esc(s.published)}</span>`:""}
        <span>·</span><span>${PN.esc(s.country||"")}</span>
      </div>
      ${intro}
      <div class="xbody" id="xbody"><div class="xload">▚ extracting article body from ${PN.esc(s.source||"source")}…</div></div>
      <div class="controls">
        <div class="ctlgroup">
          <button id="c-prev" title="previous story (K)">← PREV</button>
          <span class="pos" id="c-pos">${String(i+1).padStart(2,"0")} / ${String(view.length).padStart(2,"0")}</span>
          <button id="c-next" title="next story (J)">NEXT →</button>
        </div>
        <div class="ctlgroup">
          <button id="c-save" class="primary">${isSaved(s)?"★ SAVED":"☆ SAVE"}</button>
          <button id="c-tts">READ ALOUD</button>
          <button id="c-copy">COPY LINK</button>
        </div>
        <div class="ctlgroup">
          <span class="ctllabel">TEXT</span>
          <button id="c-fsdown" title="smaller text">A−</button>
          <button id="c-fsup" title="larger text">A+</button>
        </div>
      </div>
      <div class="note" id="xnote">READER · feed summary above · extracting full article text…</div>
    </article>`;
  reader.querySelector("#c-prev").onclick=()=>open(i-1);
  reader.querySelector("#c-next").onclick=()=>open(i+1);
  reader.querySelector("#c-save").onclick=()=>toggleSave(s);
  reader.querySelector("#c-copy").onclick=async()=>{
    try{await navigator.clipboard.writeText(s.link||s.title);PN.toast("link copied");}
    catch(e){PN.toast("clipboard blocked");}
  };
  reader.querySelector("#c-fsdown").onclick=()=>{fs=Math.max(11,fs-1);applyFs();};
  reader.querySelector("#c-fsup").onclick=()=>{fs=Math.min(22,fs+1);applyFs();};
  reader.querySelector("#c-tts").onclick=()=>{
    if(speaking){try{speechSynthesis.cancel();}catch(e){}speaking=false;PN.toast("stopped");return;}
    try{
      const u=new SpeechSynthesisUtterance(s.title+". "+(fullText||sum));
      u.rate=1;u.pitch=1;
      u.onend=()=>{speaking=false;const b=reader.querySelector("#c-tts");if(b)b.textContent="READ ALOUD";};
      speechSynthesis.cancel();speechSynthesis.speak(u);
      speaking=true;PN.toast(fullText?"reading full text aloud":"reading summary aloud");
      reader.querySelector("#c-tts").textContent="■ STOP";
    }catch(e){PN.toast("speech unavailable");}
  };
  reader.querySelector("#c-pos").textContent=String(i+1).padStart(2,"0")+" / "+String(view.length).padStart(2,"0");
  reader.scrollTop=0;
  if(window.innerWidth<=860)split.classList.add("reading");
  loadFullText(s,gen,sum);
}

function toggleSave(s){
  const k=keyOf(s);
  if(savedSet.has(k)){
    savedSet.delete(k);saveSaved();PNStore.del(k);
    PN.toast("removed from saved");
  }else{
    savedSet.add(k);saveSaved();
    const d=ART_CACHE.get(k);
    if(d)PNStore.put({link:k,title:s.title,source:s.source||d.site||"",country:s.country||"",
      ts:s.ts||0,savedAt:Date.now(),payload:d});
    else PNStore.get(k).then(rec=>{
      if(rec)PNStore.put(Object.assign({},rec,{savedAt:Date.now()}));
    });
    PN.toast("saved for later");
  }
  const b=reader.querySelector("#c-save");
  if(b)b.textContent=isSaved(s)?"★ SAVED":"☆ SAVE";
  recalc();
}

async function loadFullText(s,gen,sum){
  if(!s.link||/news\.google\.com/.test(s.link)){
    failExtract(gen,"this feed points at a Google News redirect page");
    return;
  }
  const cached=ART_CACHE.get(s.link);
  if(cached){paintExtract(cached,gen,s,sum);return;}
  const rec=await PNStore.get(s.link);
  if(gen!==artSeq)return;
  if(rec&&rec.payload&&Array.isArray(rec.payload.paragraphs)&&rec.payload.paragraphs.length){
    ART_CACHE.set(s.link,rec.payload);
    paintExtract(rec.payload,gen,s,sum);
    return;
  }
  try{
    const d=await PN.fetchJSON("/article/extract?url="+encodeURIComponent(s.link),45000);
    if(gen!==artSeq)return;
    if(!d||!Array.isArray(d.paragraphs)||!d.paragraphs.length)throw new Error("empty body");
    ART_CACHE.set(s.link,d);
    if(ART_CACHE.size>60)ART_CACHE.delete(ART_CACHE.keys().next().value);
    PNStore.put({link:s.link,title:s.title,source:s.source||d.site||"",country:s.country||"",
      ts:s.ts||0,savedAt:savedSet.has(s.link)?Date.now():null,payload:d});
    paintExtract(d,gen,s,sum);
  }catch(e){
    if(gen!==artSeq)return;
    if(rec&&rec.payload&&rec.payload.paragraphs&&rec.payload.paragraphs.length){
      paintExtract(rec.payload,gen,s,sum);
      return;
    }
    const msg=String((e&&e.message)||"extraction failed").replace(/^HTTP \d+: ?/,"");
    failExtract(gen,msg);
  }
}

function paintExtract(d,gen,s,sum){
  if(gen!==artSeq)return;
  const box=document.getElementById("xbody");
  if(!box)return;
  const norm=t=>String(t||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
  const lead=norm(sum).slice(0,90);
  let paras=d.paragraphs.filter(p=>!lead||norm(p).slice(0,90)!==lead);
  if(!paras.length)paras=d.paragraphs;
  fullText=paras.join(" ");
  const fig=d.image
    ? `<figure class="xfig"><img src="${PN.esc(d.image)}" alt="" loading="lazy" onerror="this.closest('figure').remove()"/>`+
      `<figcaption>SOURCE IMAGE · ${PN.esc(d.site||"")}</figcaption></figure>`
    : "";
  box.innerHTML=fig+paras.map(p=>`<p>${PN.esc(p)}</p>`).join("");
  const tag=document.getElementById("x-tag");
  if(tag){tag.style.display="";tag.textContent=d.paywalled?"PAYWALL PREVIEW":"FULL TEXT";}
  const note=document.getElementById("xnote");
  if(note){
    const bits=[];
    if(d.words)bits.push(PN.fmtNum(d.words,0)+" words");
    if(d.byline)bits.push("by "+d.byline);
    if(d.published)bits.push(String(d.published).slice(0,10));
    bits.push("via "+String(d.extractor||"extractor"));
    note.textContent=(d.paywalled
      ?"PAYWALLED · free preview only · "
      :"EXTRACTED FROM SOURCE · ")+bits.join(" · ");
  }
}

function failExtract(gen,msg){
  if(gen!==artSeq)return;
  const box=document.getElementById("xbody");
  if(box)box.innerHTML=`<p class="xfail">no readable article body could be extracted from this source.<br/>
    <span class="small">${PN.esc(msg||"publisher blocks crawlers, or the page is JS-only")} — the feed summary above is what the wire exposes. open the story on the publisher site for the full text.</span></p>`;
  const note=document.getElementById("xnote");
  if(note)note.textContent="FEED SUMMARY ONLY · extraction unavailable";
}

/* ---------- deep links: #a=<encoded article link> ---------- */
function linkFromHash(){
  const m=location.hash.match(/^#a=(.+)$/);
  if(!m)return "";
  try{return decodeURIComponent(m[1]);}catch(e){return "";}
}

function openFromHash(){
  const link=linkFromHash();
  if(!link)return false;
  let idx=view.findIndex(s=>keyOf(s)===link);
  if(idx<0){
    // the linked story may be filtered out — relax filters once
    query="";document.getElementById("q").value="";
    sector="ALL";region="";unreadOnly=false;savedOnly=false;
    document.getElementById("unread-only").checked=false;
    document.getElementById("saved-only").checked=false;
    sectors();recalc();
    idx=view.findIndex(s=>keyOf(s)===link);
  }
  if(idx<0)return false;
  open(idx,{fromHistory:true});
  return true;
}

window.addEventListener("popstate",()=>{
  if(!openFromHash())split.classList.remove("reading");
});

document.getElementById("q").addEventListener("input",e=>{
  query=e.target.value;sel=-1;scheduleBodySearch();recalc();
});
document.getElementById("unread-only").addEventListener("change",e=>{
  unreadOnly=e.target.checked;recalc();
});
document.getElementById("saved-only").addEventListener("change",e=>{
  savedOnly=e.target.checked;recalc();
});
document.getElementById("mark-all").onclick=()=>{
  stories.forEach(s=>readSet.add(keyOf(s)));
  saveRead();recalc();PN.toast("all stories marked read");
};
document.addEventListener("keydown",e=>{
  if(document.activeElement&&document.activeElement.tagName==="INPUT"){
    if(e.key==="Escape"&&document.activeElement.id==="q"){document.getElementById("q").blur();}
    return;
  }
  if(e.key==="/"){e.preventDefault();document.getElementById("q").focus();}
  else if(e.key==="j"||e.key==="ArrowDown"){e.preventDefault();open(Math.min(view.length-1,sel+1));}
  else if(e.key==="k"||e.key==="ArrowUp"){e.preventDefault();open(Math.max(0,sel-1));}
  else if(e.key==="s"&&sel>=0&&view[sel]){e.preventDefault();toggleSave(view[sel]);}
  else if(e.key==="Escape"){
    split.classList.remove("reading");
    try{history.replaceState(null,"",location.pathname+location.search);}catch(err){}
  }
});

applyFs();
PN.loadStories().then(async d=>{
  stories=d;
  // bring back read-later items that have dropped out of the live wire
  const savedRows=(await PNStore.all()).filter(r=>savedSet.has(r.link));
  const have=new Set(stories.map(keyOf));
  for(const r of savedRows){
    if(have.has(r.link))continue;
    const p=r.payload||{};
    stories.push({
      title:r.title||p.title||r.link,summary:(p.excerpt||""),source:r.source||p.site||"",
      country:r.country||"",ts:r.ts||0,link:r.link,category:"SAVED",sector:"SAVED"
    });
  }
  sectors();recalc();
  if(query.trim().length>=3)runBodySearch();
  if(!openFromHash()){
    const first=view.findIndex(s=>!isRead(s));
    if(first>=0)open(first,{replace:true});
    else if(view.length)open(0,{replace:true});
  }
});
</script>
</body>
</html>
